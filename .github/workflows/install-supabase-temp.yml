name: Temporary install Supabase dependency
on:
  push:
    branches: [login-premium-ios]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use pinned npm
        run: npm install --global npm@12.0.2
      - name: Install pinned Supabase client
        run: npm install --save-exact @supabase/supabase-js@2.116.0
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/install-supabase-temp.yml
          git add package.json package-lock.json
          git commit -m "Add Supabase client dependency"
          git push origin HEAD:login-premium-ios
