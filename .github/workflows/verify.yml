name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use pinned npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Save verified lockfile and build
        uses: actions/upload-artifact@v4
        with:
          name: verified-build
          path: |
            package-lock.json
            dist/
          if-no-files-found: error
          retention-days: 7
      - name: Commit initial verified lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getContent({ owner, repo, path: 'package-lock.json', ref: context.sha });
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (ref.object.sha !== context.sha) {
              core.notice('Main advanced; the next successful run will save its own lockfile.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch: 'main', path: 'package-lock.json',
              message: 'build: commit verified dependency lockfile',
              content: fs.readFileSync('package-lock.json').toString('base64')
            });
