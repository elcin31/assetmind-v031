name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use pinned npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        continue-on-error: true
        run: npm audit
      - name: Check deployment script
        run: node --check scripts/smoke.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Save verified lockfile and build
        uses: actions/upload-artifact@v4
        with:
          name: verified-build
          path: |
            package-lock.json
            dist/
          if-no-files-found: error
          retention-days: 7
